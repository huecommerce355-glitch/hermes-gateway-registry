registry:
  name: hermes-gateway-registry
  version: 1.0.0
  protocol:
    name: HACP
    version: "1.0"
  gateways:
    - name: coding-agent-gateway
      version: 1.1.0
      lifecycle: stable
      layer: infrastructure
      domain: coding
      protocol: {name: HACP, version: "1.0"}
      message_prefix: cag.
      error_prefix: ERR-CAG-
      operations: [codex.exec, codex.review, codex.test, codex.commit, cursor.review, cursor.refactor, cursor.arch, agent.health]
      managed_agents: [codex, cursor]
      probe_cmd: "python3 /Users/hudongyao/.hermes/skills/coding-agent-gateway/scripts/health_check.py"
      owner: {team: infrastructure, maintainer: hudongyao}
      boundaries:
        delegated_to: [github-development-gateway, obsidian-knowledge-gateway]
    - name: github-development-gateway
      version: 1.2.0
      lifecycle: stable
      layer: infrastructure
      domain: github-lifecycle
      protocol: {name: HACP, version: "1.0"}
      message_prefix: gh.
      error_prefix: ERR-GW-
      operations: [auth, repo, issue, branch, pr, actions, release, label.bootstrap, pr_resilience, provider_health]
      probe_cmd: "gh auth status"
      owner: {team: infrastructure, maintainer: hudongyao}
      boundaries:
        delegated_to: [coding-agent-gateway, obsidian-knowledge-gateway]
    - name: obsidian-knowledge-gateway
      version: 1.2.0
      lifecycle: stable
      layer: infrastructure
      domain: knowledge
      protocol: {name: HACP, version: "1.0"}
      message_prefix: kng.
      error_prefix: ERR-KNG-
      operations: [knowledge.write, knowledge.read, knowledge.search, knowledge.index]
      probe_cmd: "python3 -c \"import os; print('vault exists:', os.path.isdir(os.path.expanduser('~/Documents/Obsidian Vault')))\""
      owner: {team: infrastructure, maintainer: hudongyao}
      boundaries:
        delegated_to: [coding-agent-gateway, github-development-gateway]
    - name: chatgpt-strategy-gateway
      version: 1.2.0
      lifecycle: stable
      layer: strategy
      domain: strategy
      protocol: {name: HACP, version: "1.0"}
      message_prefix: strategy.
      error_prefix: ERR-STR-
      operations: [strategy.context.request, strategy.knowledge.read, strategy.adr.propose, strategy.handoff]
      probe_cmd: "python3 -c \"import os; print('gateway dir exists:', os.path.isdir(os.path.expanduser('~/.hermes/skills/chatgpt-strategy-gateway')))\""
      owner: {team: strategy, maintainer: hudongyao}
      boundaries:
        delegated_to: [coding-agent-gateway, github-development-gateway, obsidian-knowledge-gateway]
    - name: aiwp-pipeline
      version: 1.2.0
      lifecycle: stable
      layer: management
      domain: pipeline
      protocol: {name: HACP, version: "1.0"}
      message_prefix: pipeline.
      error_prefix: ERR-PIPE-
      operations: [pipeline.run, pipeline.manifest.load, pipeline.stage.execute]
      probe_cmd: "python3 -c \"import os; print('pipeline dir exists:', os.path.isdir(os.path.expanduser('~/.hermes/skills/aiwp-pipeline')))\""
      owner: {team: platform, maintainer: hudongyao}
      boundaries:
        delegated_to: [chatgpt-strategy-gateway, coding-agent-gateway, github-development-gateway, obsidian-knowledge-gateway]
  release:
    manifest: "m0.2-release-freeze"
    date: "2026-08-08"
    status: "frozen"
    components:
      - {name: chatgpt-strategy-gateway, version: "1.2.0", tag: "v1.2.0"}
      - {name: obsidian-knowledge-gateway, version: "1.2.0", tag: "v1.2.0"}
      - {name: aiwp-pipeline, version: "1.2.0", tag: "v1.2.0"}
      - {name: coding-agent-gateway, version: "1.1.0", tag: "v1.1.0"}
      - {name: github-development-gateway, version: "1.2.0", tag: "v1.2.0"}
    freeze_conditions:
      - "components tagged with git tags"
      - "registry schema validated"
      - "all gateway tests green"
    release_history:
      - manifest: "m0.1-release-freeze"
        date: "2026-08-07"
        status: "frozen"
      - manifest: "m0.2-active"
        date: "2026-08-07"
        status: "active"
        components:
          - {name: coding-agent-gateway, version: "1.1.0", tag: "v1.1.0"}
          - {name: github-development-gateway, version: "1.2.0", tag: "v1.2.0"}
          - {name: obsidian-knowledge-gateway, version: "1.1.0", tag: "v1.1.0"}
          - {name: chatgpt-strategy-gateway, version: "1.1.0", tag: "v1.1.0"}
          - {name: aiwp-pipeline, version: "1.1.0", tag: "v1.1.0"}
      - manifest: "m0.2-b-active"
        date: "2026-08-08"
        status: "active"
        components:
          - {name: coding-agent-gateway, version: "1.1.0", tag: "v1.1.0"}
          - {name: github-development-gateway, version: "1.2.0", tag: "v1.2.0"}
          - {name: obsidian-knowledge-gateway, version: "1.2.0", tag: "v1.2.0"}
          - {name: chatgpt-strategy-gateway, version: "1.2.0", tag: "v1.2.0"}
          - {name: aiwp-pipeline, version: "1.2.0", tag: "v1.2.0"}
      - manifest: "m0.2-release-freeze"
        date: "2026-08-08"
        status: "frozen"
        components:
          - {name: chatgpt-strategy-gateway, version: "1.2.0", tag: "v1.2.0"}
          - {name: obsidian-knowledge-gateway, version: "1.2.0", tag: "v1.2.0"}
          - {name: aiwp-pipeline, version: "1.2.0", tag: "v1.2.0"}
          - {name: coding-agent-gateway, version: "1.1.0", tag: "v1.1.0"}
          - {name: github-development-gateway, version: "1.2.0", tag: "v1.2.0"}
        records:
          adrs_accepted: ["ADR-001", "ADR-002", "ADR-003", "ADR-004", "ADR-005", "ADR-006"]
          adr_status: "all accepted"
          milestones:
            - "m0.2-a: HTTP transport + metadata filtering + parallel pipeline (v1.1.0)"
            - "m0.2-b: trace context continuity (v1.2.0)"
          capabilities:
            - "trace-context: strategy request_id/trace_id -> pipeline -> knowledge frontmatter/index"
            - "parallel-pipeline: max_parallel=2, per-instance trace_id isolation, knowledge write lock"
            - "http-transport: OpenAPI + API Key auth, strategy.* boundary"
            - "metadata-filtering: tag/status/project search filters"

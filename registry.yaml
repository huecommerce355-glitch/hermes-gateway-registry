registry:
  name: hermes-gateway-registry
  version: 1.0.0
  protocol:
    name: HACP
    version: "1.0"
  gateways:
    - name: coding-agent-gateway
      version: 1.2.0
      lifecycle: stable
      layer: infrastructure
      domain: coding
      protocol: {name: HACP, version: "1.0"}
      message_prefix: cag.
      error_prefix: ERR-CAG-
      operations: [codex.exec, codex.review, codex.test, codex.commit, cursor.review, cursor.refactor, cursor.arch, agent.health]
      managed_agents: [codex, cursor]
      capabilities:
        agents:
          - {name: codex, capabilities: [implementation, testing, debugging], auth_status: logged_in, production: true}
          - {name: cursor, capabilities: [code_review, refactor, architecture_review], auth_status: needs_login, production: true, degraded_fallback: "codex.review with degraded_from: cursor"}
      routing:
        - {capability: [implementation, testing, debugging], agent: codex}
        - {capability: [code_review, refactor, architecture_review], agent: cursor, fallback: "codex.review + degraded_from: cursor"}
      probe_cmd: "python3 /Users/hudongyao/.hermes/skills/coding-agent-gateway/scripts/health_check.py"
      owner: {team: infrastructure, maintainer: hudongyao}
      boundaries:
        delegated_to: [github-development-gateway, obsidian-knowledge-gateway]
    - name: github-development-gateway
      version: 1.2.0
      lifecycle: stable
      layer: infrastructure
      domain: github-lifecycle
      protocol: {name: HACP, version: "1.0"}
      message_prefix: gh.
      error_prefix: ERR-GW-
      operations: [auth, repo, issue, branch, pr, actions, release, label.bootstrap, pr_resilience, provider_health]
      probe_cmd: "gh auth status"
      owner: {team: infrastructure, maintainer: hudongyao}
      boundaries:
        delegated_to: [coding-agent-gateway, obsidian-knowledge-gateway]
    - name: obsidian-knowledge-gateway
      version: 1.3.0
      lifecycle: stable
      layer: infrastructure
      domain: knowledge
      protocol: {name: HACP, version: "1.0"}
      message_prefix: kng.
      error_prefix: ERR-KNG-
      operations: [knowledge.write, knowledge.read, knowledge.search, knowledge.index]
      probe_cmd: "python3 -c \"import os; print('vault exists:', os.path.isdir(os.path.expanduser('~/Documents/Obsidian Vault')))\""
      owner: {team: infrastructure, maintainer: hudongyao}
      boundaries:
        delegated_to: [coding-agent-gateway, github-development-gateway]
    - name: chatgpt-strategy-gateway
      version: 1.3.1
      lifecycle: stable
      layer: strategy
      domain: strategy
      protocol: {name: HACP, version: "1.0"}
      message_prefix: strategy.
      error_prefix: ERR-STR-
      operations: [strategy.context.request, strategy.knowledge.read, strategy.adr.propose, strategy.handoff]
      probe_cmd: "python3 -c \"import os; print('gateway dir exists:', os.path.isdir(os.path.expanduser('~/.hermes/skills/chatgpt-strategy-gateway')))\""
      owner: {team: strategy, maintainer: hudongyao}
      boundaries:
        delegated_to: [coding-agent-gateway, github-development-gateway, obsidian-knowledge-gateway]
    - name: chatgpt-production-bridge
      version: 1.1.0
      lifecycle: stable
      layer: strategy
      domain: bridge
      protocol: {name: HACP, version: "1.0"}
      message_prefix: bridge.
      error_prefix: BRIDGE-ERR-
      operations: [bridge.transport]
      capabilities: [http-transport, api-key-auth, scope-authz, audit-log, strategy-boundary]
      boundaries: ["transport only, no business logic", "strategy.* only", "no execution capability"]
      health:
        probe_cmd: "python3 -c \"print('production bridge registry entry present')\""
      probe_cmd: "python3 -c \"print('production bridge registry entry present')\""
      owner: {team: strategy, maintainer: hudongyao}
    - name: aiwp-pipeline
      version: 1.4.0
      lifecycle: stable
      layer: management
      domain: pipeline
      protocol: {name: HACP, version: "1.0"}
      message_prefix: pipeline.
      error_prefix: ERR-PIPE-
      operations: [pipeline.run, pipeline.manifest.load, pipeline.stage.execute, pipeline.review]
      probe_cmd: "python3 -c \"import os; print('pipeline dir exists:', os.path.isdir(os.path.expanduser('~/.hermes/skills/aiwp-pipeline')))\""
      owner: {team: platform, maintainer: hudongyao}
      boundaries:
        delegated_to: [chatgpt-strategy-gateway, coding-agent-gateway, github-development-gateway, obsidian-knowledge-gateway]
  release:
    manifest: "m1.0-a-final-freeze"
    date: "2026-08-08"
    status: "frozen"
    components:
      - {name: chatgpt-production-bridge, version: "1.1.0", tag: "v1.1.0"}
      - {name: chatgpt-strategy-gateway, version: "1.3.1", tag: "v1.3.1"}
      - {name: obsidian-knowledge-gateway, version: "1.3.0", tag: "v1.3.0"}
      - {name: aiwp-pipeline, version: "1.4.0", tag: "v1.4.0"}
      - {name: coding-agent-gateway, version: "1.2.0", tag: "v1.2.0"}
      - {name: github-development-gateway, version: "1.2.0", tag: "v1.2.0"}
    agent_policy_version: "1.0"
    capabilities:
      - production-bridge
      - multi-agent-routing
      - review-engine
      - quality-gate
      - review-knowledge
      - full-e2e-validation
    agents:
